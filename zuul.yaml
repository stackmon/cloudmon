- job:
    name: cloudmon-deploy
    abstract: true
    description: |
      Deploy CloudMon
    pre-run: playbooks/pre.yaml
    run: playbooks/run.yaml
    files:
      - ^cloudmon/*
    vars:
      python_version: "3.10"

- job:
    name: cloudmon-deploy-ubuntu-jammy
    parent: cloudmon-deploy
    nodeset:
      nodes:
        - name: controller
          label: ubuntu-jammy
        - name: worker
          label: ubuntu-jammy

# Kubernetes/pod-based deployment. Instead of provisioning two ubuntu-jammy
# VMs (controller + worker) this runs the whole CloudMon stack on a single
# `zuul-debian` pod. The pod runs as root but ships without sudo and has no
# multi-node SSH setup, so it uses its own playbooks (playbooks_k8s) that
# bootstrap sudo + python and deploy on one node.
- job:
    name: cloudmon-deploy-k8s
    abstract: true
    description: |
      Deploy CloudMon on Kubernetes pods
    pre-run: playbooks_k8s/pre.yaml
    run: playbooks_k8s/run.yaml
    files:
      - ^cloudmon/*
    vars:
      python_version: "3.11"

- job:
    name: cloudmon-deploy-zuul-debian
    parent: cloudmon-deploy-k8s
    nodeset:
      nodes:
        - name: zuul-debian
          label: zuul-debian-systemd

- project:
    merge-mode: squash-merge
    default-branch: main
    check:
      jobs:
        - otc-tox-pep8
        - otc-tox-py311
        - otc-tox-docs
        - cloudmon-deploy-zuul-debian
    gate:
      jobs:
        - otc-tox-pep8
        - otc-tox-py311
        - otc-tox-docs
        - cloudmon-deploy-zuul-debian
