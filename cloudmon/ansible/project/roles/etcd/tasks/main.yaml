---
- name: Include variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files: "{{ distro_lookup_path }}"
      paths:
        - "vars"

- name: Update apt cache on Ubuntu
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.pkg_mgr != 'atomic_container'

- name: Remove conflicting Ubuntu Docker packages
  ansible.builtin.package:
    state: absent
    name: "{{ remove_packages }}"
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - remove_packages is defined
    - ansible_facts.pkg_mgr != 'atomic_container'
  register: remove_result
  until: remove_result is success
  retries: 5

- name: Install required packages
  ansible.builtin.package:
    state: present
    name: "{{ packages }}"
  when: "ansible_facts.pkg_mgr != 'atomic_container'"
  register: install_result
  until: install_result is success
  retries: 5

- name: Clean up stale sockets after package changes
  block:
    - name: Stop Docker service and socket
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - docker.service
        - docker.socket
      failed_when: false

    - name: Remove stale Docker socket and PID files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/run/docker.sock
        - /var/run/docker.pid
  when:
    - remove_result is changed or install_result is changed
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Clear systemd rate-limits and prepare containerd
  block:
    - name: Reset systemd failed state for Docker units
      ansible.builtin.systemd:
        name: "{{ item }}"
        reset_failed: true
      loop:
        - docker.socket
        - docker.service
      failed_when: false

    - name: Ensure containerd service is started and enabled
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Start and enable Docker socket and daemon
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - docker.socket
    - docker.service
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Construct cluster nodes list
  ansible.builtin.set_fact:
    etcd_cluster: "{{ (etcd_cluster|default([])) + [(item + '=https://' + hostvars[item]['internal_address'] + ':2380')] }}"
  loop: "{{ play_hosts }}"

- ansible.builtin.include_tasks: firewall.yml

- name: Ensure directories exist
  become: true
  ansible.builtin.file:
    state: "directory"
    path: "{{ item.path }}"
    mode: "{{ item.mode | default('0755') }}"
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
  loop:
    - path: "/var/lib/etcd"
      mode: "0700"
      owner: "root"
      group: "root"

- name: Write SSL files
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - src: "{{ certs_path }}/ca/ca.pem"
      dest: "/etc/ssl/private/ca.pem"
    - src: "{{ certs_path }}/certs/{{ inventory_hostname }}.pem"
      dest: "/etc/ssl/private/host.crt"
    - src: "{{ certs_path }}/keys/{{ inventory_hostname }}.pem"
      dest: "/etc/ssl/private/host.key"
  notify:
    - Restart etcd

- name: Write ETCD Systemd unit file
  become: true
  ansible.builtin.template:
    src: "etcd.service.j2"
    dest: "/etc/systemd/system/etcd.service"
    mode: "0644"
  notify:
    - Restart etcd

- name: Force all notified handlers to run at this point
  meta: flush_handlers

- name: Make sure the ETCD service started
  become: true
  ansible.builtin.systemd:
    state: "started"
    name: "etcd.service"
