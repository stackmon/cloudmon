---
# tasks file for globalmon

- name: Include variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files: "{{ distro_lookup_path }}"
      paths:
        - "vars"

- name: Include base repos role for Docker CE setup
  ansible.builtin.include_role:
    name: base.repos

- name: Update apt cache on Ubuntu
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.pkg_mgr != 'atomic_container'

- name: Remove conflicting Ubuntu Docker packages
  ansible.builtin.package:
    state: absent
    name: "{{ remove_packages }}"
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - remove_packages is defined
    - ansible_facts.pkg_mgr != 'atomic_container'
  register: remove_result
  until: remove_result is success
  retries: 5

- name: Install required packages
  ansible.builtin.package:
    state: present
    name: "{{ packages }}"
  when: "ansible_facts.pkg_mgr != 'atomic_container'"
  register: install_result
  until: install_result is success
  retries: 5

- name: Clean up stale sockets after package changes
  ansible.builtin.block:
    - name: Stop Docker service and socket
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - docker.service
        - docker.socket
      failed_when: false

    - name: Remove stale Docker socket and PID files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/run/docker.sock
        - /var/run/docker.pid
  when:
    - remove_result is changed or install_result is changed
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Clear systemd rate-limits and prepare containerd
  ansible.builtin.block:
    - name: Reset systemd failed state for Docker units
      ansible.builtin.systemd:
        name: "{{ item }}"
        reset_failed: true
      loop:
        - docker.socket
        - docker.service
      failed_when: false

    - name: Ensure containerd service is started and enabled
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Start and enable Docker socket and daemon
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - docker.socket
    - docker.service
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Write globalmon SystemD unit file
  ansible.builtin.template:
    src: "globalmon.service.j2"
    dest: "{{ globalmon_systemd_unit_path }}"
  notify:
    - Restart globalmon

- name: Create required directories
  ansible.builtin.file:
    dest: "{{ item.dest }}"
    state: directory
    mode: "{{ item.mode | default(omit) }}"
  loop:
    - { dest: "{{ globalmon_config_dir }}", mode: "0755" }
    - { dest: "{{ globalmon_log_dir }}", mode: "0777" }

- name: Write env
  ansible.builtin.template:
    src: "env_globalmon"
    dest: "{{ globalmon_env_path }}"
    mode: "0644"
  notify:
    - Restart globalmon

- name: Write globalmon config
  ansible.builtin.copy:
    content: "{{ globalmon_config | to_nice_yaml(indent=2, width=79) }}"
    dest: "{{ globalmon_config_path }}"
    mode: "0644"
  when:
    - "globalmon_config is defined"
  notify:
    - Restart globalmon

- name: Write globalmon secure config
  ansible.builtin.copy:
    content: "{{ globalmon_secure_config | to_nice_yaml(indent=2, width=79) }}"
    dest: "{{ globalmon_secure_config_path }}"
    mode: "0644"
  when:
    - "globalmon_secure_config is defined"
  notify:
    - Restart globalmon
