---
- name: Include variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files: "{{ distro_lookup_path }}"
      paths:
        - "vars"

- name: Update apt cache on Ubuntu
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.pkg_mgr != 'atomic_container'

- name: Remove conflicting Ubuntu Docker packages
  ansible.builtin.package:
    state: absent
    name: "{{ remove_packages }}"
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - remove_packages is defined
    - ansible_facts.pkg_mgr != 'atomic_container'
  register: remove_result
  until: remove_result is success
  retries: 5

- name: Install required packages
  become: true
  ansible.builtin.package:
    state: present
    name: "{{ packages }}"
  when: "ansible_facts.pkg_mgr != 'atomic_container'"
  register: install_result
  until: install_result is success
  retries: 5

- name: Clean up stale sockets after package changes
  block:
    - name: Stop Docker service and socket
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - docker.service
        - docker.socket
      failed_when: false

    - name: Remove stale Docker socket and PID files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/run/docker.sock
        - /var/run/docker.pid
  when:
    - remove_result is changed or install_result is changed
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Clear systemd rate-limits and prepare containerd
  block:
    - name: Reset systemd failed state for Docker units
      ansible.builtin.systemd:
        name: "{{ item }}"
        reset_failed: true
      loop:
        - docker.socket
        - docker.service
      failed_when: false

    - name: Ensure containerd service is started and enabled
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Start and enable Docker socket and daemon
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - docker.socket
    - docker.service
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Create epmon group
  become: yes
  ansible.builtin.group:
    name: "{{ epmon_os_group }}"
    state: "present"

- name: Create epmon user
  become: true
  ansible.builtin.user:
    name: "{{ epmon_os_user }}"
    group: "{{ epmon_os_group }}"
    groups: "{{ (container_command == 'docker') | ternary('docker', '', omit) }}"
    state: "present"

- name: Write epmon SystemD unit file
  become: true
  ansible.builtin.template:
    src: "epmon.service.j2"
    dest: "{{ epmon_systemd_unit_path }}"
  notify:
    - Restart epmon

- name: Create required directories
  become: true
  ansible.builtin.file:
    dest: "{{ item.dest }}"
    state: directory
    owner: "{{ epmon_os_user }}"
    group: "{{ epmon_os_group }}"
    mode: "{{ item.mode | default(omit) }}"
  loop:
    - {dest: "{{ epmon_config_dir }}", mode: "0755"}

- name: Write env
  become: true
  ansible.builtin.template:
    src: "env_epmon"
    dest: "{{ epmon_env_path }}"
    owner: "{{ epmon_os_user }}"
    group: "{{ epmon_os_group }}"
    mode: "0644"
  notify:
    - Restart epmon

- name: Write logging.conf
  become: true
  ansible.builtin.template:
    src: logging.conf
    dest: "{{ epmon_config_dir }}/logging.conf"
    owner: "{{ epmon_os_user }}"
    group: "{{ epmon_os_group }}"
    mode: "0644"
  notify:
    - Restart epmon

- name: Write epmon config
  become: true
  ansible.builtin.copy:
    content: "{{ epmon_config | to_nice_yaml(indent=2, width=79) }}"
    dest: "{{ epmon_config_path }}"
    group: "{{ epmon_os_group }}"
    owner: "{{ epmon_os_user }}"
    mode: "0644"
  when:
    - "epmon_config is defined"
  notify:
    - Restart epmon

- name: Write epmon secure config
  become: true
  ansible.builtin.copy:
    content: "{{ epmon_secure_config | to_nice_yaml(indent=2, width=79) }}"
    dest: "{{ epmon_secure_config_path }}"
    group: "{{ epmon_os_group }}"
    owner: "{{ epmon_os_user }}"
    mode: "0644"
  when:
    - "epmon_secure_config is defined"
  notify:
    - Restart epmon
