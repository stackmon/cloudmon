---
- name: Include variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files: "{{ distro_lookup_path }}"
      paths:
        - "vars"

- name: Update apt cache on Ubuntu
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.pkg_mgr != 'atomic_container'

- name: Remove conflicting Ubuntu Docker packages
  ansible.builtin.package:
    state: absent
    name: "{{ remove_packages }}"
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - remove_packages is defined
    - ansible_facts.pkg_mgr != 'atomic_container'
  register: remove_result
  until: remove_result is success
  retries: 5

- name: Install required packages
  ansible.builtin.package:
    state: present
    name: "{{ packages }}"
  when: "ansible_facts.pkg_mgr != 'atomic_container'"
  register: install_result
  until: install_result is success
  retries: 5

- name: Clean up stale sockets after package changes
  block:
    - name: Stop Docker service and socket
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - docker.service
        - docker.socket
      failed_when: false

    - name: Remove stale Docker socket and PID files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/run/docker.sock
        - /var/run/docker.pid
  when:
    - remove_result is changed or install_result is changed
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Clear systemd rate-limits and prepare containerd
  block:
    - name: Reset systemd failed state for Docker units
      ansible.builtin.systemd:
        name: "{{ item }}"
        reset_failed: true
      loop:
        - docker.socket
        - docker.service
      failed_when: false

    - name: Ensure containerd service is started and enabled
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Start and enable Docker socket and daemon
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - docker.socket
    - docker.service
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Ensure directories exist
  ansible.builtin.file:
    state: "directory"
    path: "{{ item }}"
    mode: "0755"
  loop:
    - "{{ graphite_config_location }}"
    - "{{ graphite_config_location }}/ssl"
    - "/var/log/graphite"
    - "/root/bin"

- name: Write config files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ graphite_config_location }}//{{ item }}"
    mode: "0664"
  loop:
    - "carbonapi.yaml"
  notify:
    - Restart carbonapi

- name: Write Carbonapi Systemd unit files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  loop:
    - src: "carbonapi.service.j2"
      dest: "/etc/systemd/system/carbonapi.service"
    - src: "carbonapi-watcher.service.j2"
      dest: "/etc/systemd/system/carbonapi-watcher.service"
    - src: "carbonapi-watcher.path.j2"
      dest: "/etc/systemd/system/carbonapi-watcher.path"
  notify:
    - Restart carbonapi

- name: Write Carbonapi-healthcheck Systemd unit files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  loop:
    - src: "carbonapi-healthcheck.service.j2"
      dest: "/etc/systemd/system/carbonapi-healthcheck.service"
    - src: "carbonapi-healthcheck.service.j2"
      dest: "/etc/systemd/system/carbonapi-healthcheck.service"
    - src: "carbonapi-healthcheck.timer.j2"
      dest: "/etc/systemd/system/carbonapi-healthcheck.timer"
  notify:
    - Restart carbonapi-healthcheck

- name: Write carbonapi-healthcheck script
  ansible.builtin.template:
    src: "carbonapi-healthcheck.sh.j2"
    dest: "/root/bin/carbonapi-healthcheck.sh"
    mode: "0744"

- name: Set proper selinux context for executable file
  ansible.builtin.sefcontext:
    target: "/root/bin/carbonapi-healthcheck.sh.j2"
    setype: bin_t
    state: present
  when: ansible_facts.selinux.status == 'enabled'
