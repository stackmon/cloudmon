---
- name: Include variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files: "{{ distro_lookup_path }}"
      paths:
        - "vars"

- name: Update apt cache on Ubuntu
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.pkg_mgr != 'atomic_container'

- name: Remove conflicting Ubuntu Docker packages
  ansible.builtin.package:
    state: absent
    name: "{{ remove_packages }}"
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - remove_packages is defined
    - ansible_facts.pkg_mgr != 'atomic_container'
  register: remove_result
  until: remove_result is success
  retries: 5

- name: Install required packages
  ansible.builtin.package:
    state: present
    name: "{{ packages }}"
  when: "ansible_facts.pkg_mgr != 'atomic_container'"
  register: install_result
  until: install_result is success
  retries: 5

- name: Clean up stale sockets after package changes
  block:
    - name: Stop Docker service and socket
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - docker.service
        - docker.socket
      failed_when: false

    - name: Remove stale Docker socket and PID files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/run/docker.sock
        - /var/run/docker.pid
  when:
    - remove_result is changed or install_result is changed
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Clear systemd rate-limits and prepare containerd
  block:
    - name: Reset systemd failed state for Docker units
      ansible.builtin.systemd:
        name: "{{ item }}"
        reset_failed: true
      loop:
        - docker.socket
        - docker.service
      failed_when: false

    - name: Ensure containerd service is started and enabled
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- name: Start and enable Docker socket and daemon
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - docker.socket
    - docker.service
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version == '22'

- include_tasks: firewall.yml

- name: Create Grafana group
  ansible.builtin.group:
    name: "{{ grafana_os_user }}"
    state: present

- name: Create Grafana user for docker/podman
  ansible.builtin.user:
    name: "{{ grafana_os_user }}"
    group: "{{ grafana_os_group }}"
    groups: "{{ 'docker' if container_command == 'docker' else '' }}"
    state: present

- name: Create required directories
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: directory
    owner: "{{ grafana_os_user }}"
    group: "{{ grafana_os_group }}"
    mode: "{{ item.mode | default(omit) }}"
  loop:
    - {dest: "/etc/grafana"}
    - {dest: "/etc/grafana/provisioning"}

- name: Write Grafana config env file
  ansible.builtin.template:
    src: "env.j2"
    dest: "/etc/grafana/env"
    owner: "{{ grafana_os_user }}"
    group: "{{ grafana_os_group }}"
    mode: 0664
  notify:
    - restart grafana

- name: Write Grafana Image Renderer Systemd unit file
  ansible.builtin.template:
    src: "grafana-renderer.service.j2"
    dest: "/etc/systemd/system/grafana-renderer.service"
  when:
    - "grafana_enable_renderer is defined"
    - "grafana_enable_renderer"
  notify:
    - restart grafana-renderer

- name: Write Grafana Systemd unit file
  ansible.builtin.template:
    src: "grafana.service.j2"
    dest: "/etc/systemd/system/grafana.service"
  notify:
    - restart grafana

- name: Force all notified handlers to run at this point, not waiting for normal sync points
  meta: flush_handlers

- name: Make sure the Grafana service started
  ansible.builtin.systemd:
    state: started
    name: "grafana.service"

- name: Wait for grafana container to listen
  ansible.builtin.wait_for:
    host: 0.0.0.0
    port: 3000
    timeout: 120

- name: Wait for api/health to come up
  ansible.builtin.uri:
    url: "http://0.0.0.0:3000/api/health"
    status_code: 200
  register: result
  until: result.status == 200
  retries: 60
  delay: 1
