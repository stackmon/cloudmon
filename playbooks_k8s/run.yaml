---
# Main run playbook for the Kubernetes/pod-based cloudmon-deploy job.
#
# The whole CloudMon stack is deployed on a single `zuul-debian` pod
# (no separate controller / worker split). Docker CE is installed
# inline here because there is no verified global ensure-docker role.
#
# Docker is needed because cloudmon's graphite/statsd/postgres
# provisioning playbooks deploy containerized components via
# ansible-runner.
#
# NOTE: the pod has no systemd as PID 1, so the docker/containerd
# daemons are started directly (background processes), not via the
# service or systemd modules.
- hosts: all
  become: true
  gather_facts: false
  vars:
    docker_ce_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
      register: prereq_result
      retries: 5
      until: prereq_result is success

    # Add Docker CE apt repository
    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # Pod environment: known zuul-debian pod (Debian bookworm, amd64).
    # No ansible_facts available — hardcode values.
    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/debian/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker CE apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker-ce.list
        mode: '0644'
        content: >-
          deb [arch=amd64
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian
          bookworm stable

    # Must refresh apt cache after adding the Docker CE repo, otherwise
    # `apt` has no idea about the `docker-ce` packages.
    - name: Update apt cache after adding Docker CE repository
      ansible.builtin.apt:
        update_cache: true

    # Remove conflicting Docker packages that may be in the distro image
    - name: Remove conflicting Docker packages
      ansible.builtin.package:
        state: absent
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
      failed_when: false

    # Install Docker CE
    - name: Install Docker CE packages
      ansible.builtin.apt:
        name: "{{ docker_ce_packages }}"
        state: present
      register: docker_install
      retries: 5
      until: docker_install is success

    # Clean up stale sockets after package changes
    - name: Remove stale Docker socket and PID files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/run/docker.sock
        - /var/run/docker.pid
      failed_when: false

    # Start daemons directly — the pod has no init system to do it.
    - name: Start containerd daemon
      ansible.builtin.shell:
        cmd: nohup /usr/bin/containerd > /var/log/containerd.log 2>&1 &
      changed_when: true

    - name: Wait for containerd socket (up to 30s)
      ansible.builtin.wait_for:
        path: /run/containerd/containerd.sock
        timeout: 30

    - name: Start dockerd daemon
      ansible.builtin.shell:
        cmd: nohup /usr/bin/dockerd > /var/log/dockerd.log 2>&1 &
      changed_when: true

    - name: Wait for Docker socket to appear (up to 60s)
      ansible.builtin.wait_for:
        path: /var/run/docker.sock
        timeout: 60

    - name: Wait for Docker daemon to be ready (docker info, retries)
      ansible.builtin.command:
        cmd: docker info
      register: docker_info
      changed_when: false
      retries: 15
      delay: 5
      until: docker_info.rc == 0

    - name: Show Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_ver
      changed_when: false
      failed_when: false

- hosts: all
  become: true
  roles:
    - install_cloudmon
    - deploy_cloudmon_k8s
